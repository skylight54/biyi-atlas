# Sets default memory used for gradle commands.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.vfs.watch=false

# ForgeGradle issues a blocking HEAD request to maven.minecraftforge.net / libraries.minecraft.net
# while applying the plugin, with no timeout. Where the TLS handshake stalls this hangs the entire
# build in the configuration phase, so the server/certificate check is disabled (same as BYKmcp).
systemProp.net.minecraftforge.gradle.check.certs=false

# This machine has JDK 17 under D:\java\jdk17; declare it so the toolchain resolves without a download.
org.gradle.java.installations.paths=D:/java/jdk17/


